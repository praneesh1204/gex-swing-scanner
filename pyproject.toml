[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gexscan"
version = "2.2.0"
description = "Read-only options scanner and strategy engine: dealer gamma, vol, flow, regime and events -> gated, confidence-scored strategy recommendations with exit plans, 2x-credit stop alerts and a synthetic backtest. Never places orders."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "yfinance>=0.2.40",
  "scipy>=1.10",
  "arch>=6.2",
  "matplotlib>=3.7",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
parquet = ["pyarrow>=14"]

[project.scripts]
gexscan = "gexscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gexscan = ["templates/*.html", "config/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
