<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gexscan{% endblock %}</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e4e4e4; --card:#f7f7f8; --good:#0a7d3b; --warn:#b26b00; --bad:#b3261e; --accent:#2457d6; --info:#0b7a99; --regime:#8a3ab9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121314; --fg:#ececec; --muted:#9a9a9a; --line:#2b2d30; --card:#1b1c1f; --good:#4cc38a; --warn:#e0a13c; --bad:#ef6b62; --accent:#7ea2ff; --info:#5cc4e0; --regime:#c58af0; } }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; margin:0; padding:24px 16px; }
  main { max-width:1150px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:18px; margin:30px 0 8px; } h3 { margin:0 0 6px; font-size:16px; }
  h4 { margin:12px 0 4px; font-size:14px; }
  a { color:var(--accent); }
  .muted { color:var(--muted); font-size:13px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
  .flag { display:inline-block; padding:1px 8px; border-radius:4px; font-size:12px; font-weight:600; border:1px solid var(--warn); color:var(--warn); margin:0 4px 4px 0; }
  .flag.bad { border-color:var(--bad); color:var(--bad); }
  .good { color:var(--good); } .warn { color:var(--warn); } .bad { color:var(--bad); } .info { color:var(--info); } .regime { color:var(--regime); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  .scroll { overflow-x:auto; }
  ul { margin:4px 0 0 18px; padding:0; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; font-size:13px; }
  .exit { border-left:3px solid var(--accent); padding:6px 10px; margin:8px 0; background:var(--bg); border-radius:4px; font-size:13px; }
  .banner { border:1px solid var(--warn); color:var(--warn); padding:10px 14px; border-radius:8px; margin:10px 0; }
  .banner.bad { border-color:var(--bad); color:var(--bad); }
  details { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:8px 0; }
  details details { background:var(--bg); }
  summary { cursor:pointer; font-weight:600; }
  .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; margin-top:8px; }
  img.chart { max-width:100%; }
  .ideas { display:grid; gap:14px; margin-top:12px; }
  .idea-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:6px 22px; }
  .idea table td.muted { font-size:12px; }
  .meter { background:var(--line); border-radius:3px; height:6px; width:90px; display:inline-block; vertical-align:middle; }
  .meter > span { display:block; height:6px; border-radius:3px; background:var(--accent); }
  .score { font-size:22px; font-weight:700; }
  .lvl { font-weight:700; white-space:nowrap; }
  .lvl-STOP, .st-stop, .o-fail { color:var(--bad); } .lvl-WARN, .st-warn, .o-unknown, .o-warn { color:var(--warn); }
  .lvl-REGIME { color:var(--regime); } .lvl-INFO { color:var(--info); } .st-ok, .o-pass { color:var(--good); } .o-ok { color:var(--muted); }
  ol.how li { margin-bottom:4px; }
  nav.top { font-size:13px; margin-bottom:6px; }
  .disc { border-top:1px solid var(--line); margin-top:30px; padding-top:10px; }
</style>
</head>
<body><main>
{% block content %}{% endblock %}
</main></body></html>
